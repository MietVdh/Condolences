{% extends "layout.html" %} 

{% block body %} 

<p class="title" id="main-title">Generate a printer-friendly list of the condolences you received</p>
<section class="section form">
  <form action="/condolences" method="post" id="form">
    <div class="field">
        <label class="label" for="src-url">Your personal condolences link</label>
        <div class="control">
            <input class="input" type="url" id="src-url" name="src-url" required>
        </div>
    </div>
    <div class="field">
        <label class="label" for="excl-auth">Optional: Don't include the following authors' messages:</label>
        <div class="control">
            <textarea class="textarea is-small" type="text" id="excl-auth" name="excl-auth"></textarea>
        </div>
        <p class="help">Please use one line per name. Intended to filter out replies to messages. 
          In most cases, this should not be necessary.
        </p>
    </div>
    <div class="field">
        <div class="control">
          <label class="radio">
            <input type="radio" name="date" value="date">
            Add date
          </label>
          <label class="radio">
            <input type="radio" name="date" value="date-time">
            Add date and time
          </label>
          <label class="radio">
            <input type="radio" name="date" value="none" checked>
            Don't add date
          </label>
        </div>
    </div>
    <div class="field">
        <div class="control">
            <button class="button is-dark" id="submit-button">Submit</button>
          </div>
    </div>
</form>

</section>

<script src="../static/script.js"></script>
{% endblock %}
